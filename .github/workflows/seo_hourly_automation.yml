name: SEO Hourly Bot Caller & Weekly Optimizer

on:
  schedule:
    # Runs at minute 0 of every hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-bot-call:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SEO Automation & Call Search Bots
        run: python seo_automation.py

      - name: Commit & Push if Sitemap Changed
        run: |
          git config --global user.name "CouponTruck-SEO-Bot"
          git config --global user.email "bot@coupontruck.io"
          git add sitemap.xml index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-SEO: Update sitemap & ping search bots [skip ci]" && git push)
